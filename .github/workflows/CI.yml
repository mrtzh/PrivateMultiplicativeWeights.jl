name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - julia-version: min
            os: ubuntu-latest
          - julia-version: '1'
            os: ubuntu-latest
          - julia-version: '1'
            os: macos-latest
          - julia-version: '1'
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - name: Run tests
        shell: bash
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.test(julia_args=["--startup-file=no", "--depwarn=error", "--check-bounds=yes"])'
